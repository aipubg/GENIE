<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GENIE Login Gate Test</title>
</head>
<body>
  <h1>GENIE Login Gate Test Page</h1>
  <p>An isolated local page that mimics a sign-in wall.</p>

  <form action="#" method="post">
    <label for="u">Email</label>
    <input id="u" name="u" type="text" placeholder="you@example.com">
    <label for="p">Password</label>
    <input id="p" name="p" type="password" placeholder="password">
    <button id="login" type="button">Log in</button>
  </form>

  <p>New here? Sign up for free to continue.</p>
</body>
</html>
