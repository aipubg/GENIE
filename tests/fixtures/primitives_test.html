<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GENIE Primitives Test</title>
</head>
<body>
  <h1>GENIE Primitives Test Page</h1>
  <p>An isolated local page used to prove the reusable browser primitives.</p>

  <label for="q">Search box</label>
  <input id="q" name="q" aria-label="search box" placeholder="Type here">

  <button id="go" type="button"
          onclick="document.getElementById('out').textContent = 'clicked:' + document.getElementById('q').value">
    Go
  </button>

  <div id="out"></div>

  <a id="lnk" href="https://example.com">Example Link</a>
</body>
</html>
