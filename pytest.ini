[pytest]
testpaths = tests
# Test categories. The *default* run is the deterministic suite: pure logic, throwaway databases,
# no shared desktop state. Anything that mutates the real machine is opt-in.
#
#   pytest                                   deterministic suite (must be fully green)
#   pytest -m real_machine                   serial real-desktop suite (one at a time, lock held)
#   pytest -m hardware_optional              tests needing hardware that may be absent
#   pytest -m owner_acceptance               items only the owner can perform
#   pytest -m ""                             everything
markers =
    deterministic: pure logic with a throwaway database; no shared machine state (default)
    real_machine: mutates shared real desktop state (volume, foreground window, keyboard/mouse, Chrome profile/session, mic/speaker) and must run serially
    hardware_optional: needs hardware that may legitimately be absent (microphone, camera, GPIO, relay board, second device)
    owner_acceptance: requires the owner physically (speaking, clicking, confirming) and cannot be automated

# Deselect the shared-state classes by default so the normal suite can be green. Nothing is
# weakened: these tests still exist and still assert exactly what they asserted before.
#
# TEST CLASSES (reported separately, never merged into one "all green" number):
#
#   GENIE deterministic     tests/ minus external_optional, deselecting shared-state markers
#                           -> `pytest` (this file's default)
#   GENIE external_optional tests/external_optional/  (needs donor runtimes in the managed venv)
#                           -> <managed-python> -m pytest tests/external_optional -q
#   upstream donor tests    vendor/strix-audit/strix-main/tests  (93 tests, upstream's own)
#   real_machine            -m real_machine     (one desktop, serial, lock held)
#   hardware_optional       -m hardware_optional (mic/camera/GPIO may be absent)
#   owner_acceptance        -m owner_acceptance  (owner must physically act)
#
# Exclusion is PRECISE, not blanket: only the audit-only upstream checkout that ships its own
# test suite is ignored. `vendor/prime_rlm` (the real vendored Prime runtime) contains no
# tests, so it is deliberately NOT excluded — a future vendored donor test tree must be
# excluded explicitly, on its merits, rather than hidden by a broad vendor/ rule.
addopts = -m "not real_machine and not hardware_optional and not owner_acceptance" --ignore=tests/external_optional --ignore=vendor/strix-audit

# Real-machine tests must never run in parallel against one desktop.
# (No xdist here; this documents the intent for when it is added.)

# ---------------------------------------------------------------------------
# Collection hygiene: build outputs are NOT test trees.
#
# `backend-dist/backend-runtime/python/site-packages` is a vendored, packaged
# CPython that ships third-party test suites (win32comext, pip, setuptools...).
# Importing one of them (taskscheduler/test/test_addtask.py) raises a Windows
# access violation and kills the whole run with a segfault — before a single
# GENIE test executes. Same class of risk for dist-electron*/.build (copied
# trees) and node_modules.
#
# These directories are generated artefacts, never sources of truth, so they
# are excluded by name rather than by a blanket rule.
norecursedirs = *.egg .git .build build dist dist-electron* backend-dist node_modules __pycache__ .venv venv vendor/strix-audit
